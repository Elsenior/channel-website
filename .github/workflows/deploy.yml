# Builds the React site and publishes it to GitHub Pages on every push to main.
# `npm run build` type-checks the code, minifies it, and writes one HTML file per page into dist/.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # While the repo's Pages source is "Deploy from a branch", GitHub also publishes the raw
      # repo files on each push, and the last deployment wins. Waiting makes the built site win.
      # Remove this step once Settings > Pages > Source is set to "GitHub Actions".
      - name: Wait for GitHub's branch deployment to finish
        run: sleep 90

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
